      // Evening in Shenzhen (the desk lamp's on): the room is dim and warm from the first paint, not white first.
      // This is src/lib/sydneySun.ts and the lamp's remembered switch in src/desk/store.ts, in brief.
      (function () {
        var evening = false;
        try {
          var at = new Date();
          var rad = function (d) { return (d * Math.PI) / 180; };
          var parts = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit" })
            .format(at).split("-").map(Number);
          var sun = function (offset) {
            var midnight = Date.UTC(parts[0], parts[1] - 1, parts[2] + offset);
            var g = ((2 * Math.PI) / 365) * Math.round((midnight - Date.UTC(parts[0], 0, 1)) / 86400000);
            var eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
            var decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
            var ha = (Math.acos(Math.cos(rad(90.833)) / (Math.cos(rad(22.54)) * Math.cos(decl)) - Math.tan(rad(22.54)) * Math.tan(decl)) * 180) / Math.PI;
            return { rise: midnight + (720 - 4 * (114.06 + ha) - eq) * 60000, set: midnight + (720 - 4 * (114.06 - ha) - eq) * 60000 };
          };
          var today = sun(0);
          evening = at.getTime() < today.rise || at.getTime() >= today.set;
          var saved = JSON.parse(localStorage.getItem("xueyinglabs:lamp") || "null");
          if (saved && Date.now() < saved.until) evening = saved.evening;
        } catch (e) {}
        if (evening) {

          document.getElementById("shell-title").classList.add("text-[#F3E9DA]");

    <audio id="jb-audio" preload="metadata"></audio>
    <script>
      (function () {
        var btn = document.getElementById("jb-btn"), panel = document.getElementById("jb-panel");
        var list = document.getElementById("jb-list"), audio = document.getElementById("jb-audio");
        var nameEl = document.getElementById("jb-name"), timeEl = document.getElementById("jb-time");
        var prog = document.getElementById("jb-prog"), playBtn = document.getElementById("jb-play");
        var TRACKS = [], cur = 0;

        function fmt(t) {
          if (!isFinite(t)) return "0:00";
          var m = Math.floor(t / 60), s = Math.floor(t % 60);
          return m + ":" + (s < 10 ? "0" : "") + s;
        }
        function paint() {
          list.innerHTML = "";
          TRACKS.forEach(function (tr, i) {
            var li = document.createElement("li");
            var b = document.createElement("button");
            b.type = "button";
            b.className = i === cur ? "on" : "";
            b.innerHTML = '<span class="n">' + (i === cur ? "▶" : i + 1) + '</span><span class="t"></span>';
            b.querySelector(".t").textContent = tr.title || ("曲目 " + (i + 1));
            b.onclick = function () { select(i, true); };
            li.appendChild(b);
            list.appendChild(li);
          });
          var t = TRACKS[cur];
          nameEl.textContent = t ? (t.title || "曲目") : "还没选";
          playBtn.textContent = audio.paused ? "播放" : "暂停";
        }
        function select(i, autoplay) {
          if (!TRACKS.length) return;
          cur = (i + TRACKS.length) % TRACKS.length;
          audio.src = TRACKS[cur].src;
          prog.style.width = "0%";
          timeEl.textContent = "0:00";
          paint();
          if (autoplay) audio.play().catch(function () {});
        }
        function toggle() {
          if (!TRACKS.length) return;
          if (!audio.src) select(cur, true);
          else if (audio.paused) audio.play().catch(function () {});
          else audio.pause();
        }
        audio.addEventListener("play", function () { playBtn.textContent = "暂停"; paint(); });
        audio.addEventListener("pause", function () { playBtn.textContent = "播放"; });
        audio.addEventListener("timeupdate", function () {
          if (audio.duration) {
            prog.style.width = (audio.currentTime / audio.duration * 100) + "%";
            timeEl.textContent = fmt(audio.currentTime) + " / " + fmt(audio.duration);
          }
        });
        audio.addEventListener("ended", function () { select(cur + 1, true); });

        btn.onclick = function () {
          panel.hidden = !panel.hidden;
          btn.setAttribute("aria-expanded", String(!panel.hidden));
        };
        document.getElementById("jb-close").onclick = function () { panel.hidden = true; btn.setAttribute("aria-expanded", "false"); };
        playBtn.onclick = toggle;
        document.getElementById("jb-next").onclick = function () { select(cur + 1, true); };
        document.getElementById("jb-prev").onclick = function () { select(cur - 1, true); };
        // 桌面上那台唱片机点一下，就放这里的歌
        window.__deskPlay = function () { panel.hidden = false; toggle(); };

        fetch("/music/tracks.json", { cache: "no-store" })
          .then(function (r) { return r.ok ? r.json() : { tracks: [] }; })
          .then(function (j) {
            TRACKS = (j.tracks || []).filter(function (t) { return t && t.src; });
            if (!TRACKS.length) TRACKS = [{ title: "我的歌 01", src: "/music/01.m4a" }];
            var saved = Number(localStorage.getItem("jb:track") || 0);
            cur = isFinite(saved) && saved >= 0 && saved < TRACKS.length ? saved : 0;
            audio.src = TRACKS[cur].src;
            paint();
          })
          .catch(function () { TRACKS = [{ title: "我的歌 01", src: "/music/01.m4a" }]; paint(); });
      })();
    </script>
